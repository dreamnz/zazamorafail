name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        working-directory: zazamora
      - name: Renombrar
        run: cp zazamora/app/build/outputs/apk/debug/app-debug.apk zazamora-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zazamora-debug-apk
          path: zazamora-debug.apk
